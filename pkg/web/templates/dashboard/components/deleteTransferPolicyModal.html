{{ define "deleteTransferPolicyModal" }}
<div id="deleteTransferPolicyModal" class="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Delete Transfer Policy?</h4>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close">
        </button>
      </div>
      <div class="modal-body">
          <div class="alert alert-light">
          Deleting this policy will stop it from automatically responding to, labeling, or archiving new transfers that match its criteria.
        </div>
        <p class="px-3 text-danger">
          Are you sure you want to delete this transfer policy?
        </p>
      </div>
      <div class="modal-footer">
        <button id="deleteBtn" type="button" class="btn btn-danger">
          Delete
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
{{- end }}
