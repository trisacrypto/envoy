{{ define "createCounterpartyModal" }}
<div id="createCounterpartyModal" class="modal modal-lg" tabindex="-1">
  <div class='modal-dialog'>
    <div class="modal-content">
      <div class="modal-header mb-n3">
        <h4 class="modal-title">Add Counterparty</h4>
        <ul class="nav nav-tabs nav-tabs-sm card-header-tabs mb-n3" role="tablist">
          <li class="nav-item">
            <button id="createCounterpartyTabSunrise" class="nav-link active" data-bs-toggle="tab"
              data-bs-target="#createCounterpartyTabSunrisePane" type="button" role="tab"
              aria-controls="create-counterparty-sunrise-tab-pane", area-selected="true">
              <i class="fe fe-sunrise"></i>
              Sunrise
            </button>
          </li>
          <li class="nav-item">
            <button id="createCounterpartyTabTRP" class="nav-link" data-bs-toggle="tab"
              data-bs-target="#createCounterpartyTabTRPPane" type="button" role="tab"
              aria-controls="create-counterparty-trp-tab-pane" , area-selected="false">
              <i class="fe fe-zap"></i>
              TRP
            </button>
          </li>
          <li class="nav-item">
            <button id="createCounterpartyTabTRISA" class="nav-link" data-bs-toggle="tab"
              data-bs-target="#createCounterpartyTabTRISAPane" type="button" role="tab"
              aria-controls="create-counterparty-trisa-tab-pane" , area-selected="false">
              <i class="fe fe-shield"></i>
              TRISA
            </button>
          </li>
        </ul>
      </div>
      <div class="modal-body">
        <div id="createCounterpartyAlerts" class="alerts"></div>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="createCounterpartyTabSunrisePane"
            role="tabpanel" aria-labelledby="createCounterpartyTabSunrise" tabindex="0">
            <h4>Sunrise</h4>
          </div>
          <div class="tab-pane fade" id="createCounterpartyTabTRPPane"
            role="tabpanel" aria-labelledby="createCounterpartyTabTRP" tabindex="0">
            <h4>TRP</h4>
          </div>
          <div class="tab-pane fade" id="createCounterpartyTabTRISAPane"
            role="tabpanel" aria-labelledby="createCounterpartyTabTRISA" tabindex="0">
            <h4>TRISA</h4>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span id="loader" class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <button type="submit" form="createCounterpartyForm" class="btn btn-primary">
          Create
        </button>
        <button type="reset" form="createCounterpartyForm" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
{{- end }}
