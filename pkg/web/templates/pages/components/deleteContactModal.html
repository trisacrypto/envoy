{{ define "deleteContactModal" }}
<div id="deleteContactModal" class="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Delete Contact?</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="px-2 text-danger">Are you sure you want to delete <strong id="deleteContactLabel"></strong>?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button id="deleteContactBtn" type="button" class="btn btn-danger" hx-delete="/v1/counterparties/{{ .ID }}/contacts/">Delete</button>
      </div>
    </div>
  </div>
</div>
{{ end }}
